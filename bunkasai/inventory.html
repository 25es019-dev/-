<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在庫管理</title>
  <link rel="stylesheet" href="bunkasai.CSS">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="メインナビゲーション">
      <a class="nav-link" href="system.html">販売管理</a>
      <a class="nav-link" href="sales.html">売上管理</a>
      <a class="nav-link active" href="inventory.html" aria-current="page">在庫管理</a>
    </nav>
  </header>
  <main>
    <h1>在庫管理</h1>
    <p>ポテトと竜田揚げの在庫数を入力して登録してください。ソース付き商品も同じ在庫から減ります。</p>
    <div id="storage-status" role="alert" hidden></div>
    <form id="inventory-form">
      <section class="product-list" aria-label="商品別の在庫">
        <div class="product-card">
          <h2>ポテト（ソース付き含む）</h2>
          <p class="inventory-current">現在の在庫：<span class="product-stock" aria-live="polite">0</span>個</p>
          <div class="inventory-field">
            <label for="stock-0">登録する在庫数</label>
            <div><input class="stock-input" id="stock-0" type="number" min="0" step="1" required inputmode="numeric"><span>個</span></div>
          </div>
        </div>
        <div class="product-card">
          <h2>竜田揚げ（ソース付き含む）</h2>
          <p class="inventory-current">現在の在庫：<span class="product-stock" aria-live="polite">0</span>個</p>
          <div class="inventory-field">
            <label for="stock-1">登録する在庫数</label>
            <div><input class="stock-input" id="stock-1" type="number" min="0" step="1" required inputmode="numeric"><span>個</span></div>
          </div>
        </div>
      </section>
      <button id="register-inventory" type="submit">在庫を登録</button>
    </form>
  </main>
  <script src="inventory.js"></script>
</body>
</html>
